services:
  - type: web
    name: mikrotik-billing
    runtime: docker
    repo: https://github.com/IKIYY19/Mikrotik-billing.git
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Use the existing Render PostgreSQL database. Render cannot provision
      # another free database when one is already active on the account.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: MPESA_ENVIRONMENT
        value: live
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        fromService:
          name: mikrotik-billing
          type: web
          envVarKey: RENDER_EXTERNAL_URL
